# 表面平整檢查系統 現場參數（需求規格書 3.0.3）
# 每個工站唯一需要修改的檔案；安裝包內的程式不需修改（INS-02）。

STATION_ID=ST01
APP_USER=                      # 執行 App 的帳號；留空 = 執行 sudo 的帳號
AUTOLOGIN=yes

# 設備網路（接 DL-EN1 的網卡，與公司網路分開）
EQUIP_IF=eno2
PC_IP=192.168.10.1
NET_PREFIX=24

# 初始 DL-EN1 清單（3.7）：安裝時資料庫沒有任何 DL-EN1 才匯入（DEF-10），之後於 App「設備設定」維護
DLEN1_DEF_FILE=dl-en1.json

# 資料庫（密碼留空 = 自動產生）
DB_NAME=flatness
DB_USER=flatness_app
DB_PASS=

TIMEZONE=Asia/Taipei
NTP_SERVERS=time.stdtime.gov.tw

BARCODE_VID=
BARCODE_PID=
